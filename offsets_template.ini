# neverlose.ui 偏移模板：把 = 右边补上数值即可（支持 0x 十六进制 / 十进制）
# 也可以直接在菜单 Memory 页把整段粘贴进去，会自动匹配名字


# ---- client.dll ----
# 实体列表根指针：实体系统/块表起点  [必需]
dwEntityList=0x2577BE0
# 本地玩家控制器指针（拿名字、队伍、金钱）  [必需]
dwLocalPlayerController=0x23A78D0
# 本地玩家 Pawn 指针（拿血量、坐标、武器）  [必需]
dwLocalPlayerPawn=0x23CCC08
# 世界->屏幕矩阵（16 个 float，行主序）  [必需]
dwViewMatrix=0x23D21F0
# 当前视角角度（写入即为改视角）
dwViewAngles=0x23E2C98
# GlobalVars：帧时间、tick、地图名等
dwGlobalVars=0x20B57C0
# 实体系统对象（用于块表遍历）
dwGameEntitySystem=0x2577BE0
# 实体系统中最高实体索引
dwGameEntitySystem_highestEntityIndex=0x2090
# 输入对象（用于自动化输入/瞄准）
dwCSGOInput=0x23E2610
# 已安放 C4 指针（炸弹计时绘制）
dwPlantedC4=0x23973B8
# 网络客户端（延迟、连接状态）
dwNetworkGameClient=
# Prediction 对象（外挂移动类功能常用）
dwPrediction=0x23CCB10

# ---- schema ----
# 当前血量  [必需]
m_iHealth=0x34C
# 最大血量
m_iMaxHealth=0x348
# 队伍编号（2=T / 3=CT）  [必需]
m_iTeamNum=0x3E7
# 生命状态（0=存活）  [必需]
m_lifeState=0x354
# 世界坐标（部分版本叫 m_vOldOrigin）  [必需]
m_vecAbsOrigin=0xC8
# 场景节点指针（坐标/骨骼挂在这里）  [必需]
m_pGameSceneNode=0x330
# 模型状态（骨骼矩阵基址 = modelState + 0x80）  [必需]
m_modelState=0x140
# 眼睛相对坐标偏移（画骨骼头节点用）
m_vecViewOffset=0xE78
# 控制器 -> Pawn 句柄  [必需]
m_hPlayerPawn=0x914
# Pawn -> 控制器 句柄（反查名字）
m_hController=0x1040
# 玩家名字字符串（旧版 m_szPlayerName）
m_iszPlayerName=0x6F4
# 休眠标记：为 1 时不要绘制  [必需]
m_bDormant=0x103
# 被点亮（雷达可见）
m_bSpotted=0x8
# EntitySpottedState_t 在实体内的偏移（CS2 的 m_bSpotted 藏在里面）
m_entitySpottedState=0x1C60
# 被谁看见的位掩码（可见性判断）
m_bSpottedByMask=
# 开火计数（后坐力/瞄准判断）
m_iShotsFired=0x1C8C
# 瞄准冲量（无后坐力需要）
m_aimPunchAngle=
# 当前视野角度（FOV 修改）
m_iFOV=0x290
# 是否开镜
m_bIsScoped=0x1C78
# 闪光最大白度（去闪）
m_flFlashMaxAlpha=0x1424
# 护甲值
m_ArmorValue=0x1CA4
# 是否有头盔
m_bHasHelmet=0x49
# C_BasePlayerPawn -> CPlayer_ItemServices（读头盔）
m_pItemServices=
# 当前闪光强度（0..1，画 FLASH 标记）
m_flFlashDuration=
# 武器是否在换弹（画 RELOAD 标记）
m_bInReload=
# 控制器 -> 金钱服务（读 $）
m_pInGameMoneyServices=

# ---- c4 ----
# 已安放且正在倒计时
m_bBombTicking=
# 爆炸时刻（全局时间）
m_flC4Blow=
# 炸弹总时长
m_flTimerLength=
# 包点编号（0=A / 1=B）
m_nBombSite=
# 是否正在被拆
m_bBeingDefused=
# 拆包完成时刻
m_flDefuseCountDown=
# 拆包人句柄
m_hBombDefuser=

# ---- schema ----
# 是否正在拆包（KIT 标记）
m_bIsDefusing=0x1C7A
# 速度（部分版本叫 m_vecAbsVelocity）
m_vecVelocity=0x430
# 实体模拟时间（拿它当服务器当前时间，算炸弹倒计时）
m_flSimulationTime=
# 状态标志（在地面 FL_ONGROUND 等）
m_fFlags=0x3F4
# 武器服务指针
m_pWeaponServices=0x1208
# 当前武器句柄
m_hActiveWeapon=0x60
# C_EconEntity -> CAttributeManager（武器 ID 链中间层）
m_AttributeManager=0x11A8
# CAttributeManager -> C_EconItemView（CS2 一般 0x50）
m_AttributeManager_Item=0x50
# 当前弹匣子弹数
m_iClip1=0x1700
# 武器 ID（用于显示武器名）
m_iItemDefinitionIndex=0x1BA
# 金钱
m_iAccount=0x40
# 延迟
m_iPing=0x830
# 竞技段位
m_iCompetitiveRanking=0x888
# 眼睛角度（画朝向/瞄准线用）
m_angEyeAngles=0x3350
# 坐标来自场景节点=1 / 来自实体本体=0（CS2 为 1）
kOriginFromSceneNode=0x1
# 休眠标记取自场景节点=1 / 实体=0（CS2 的 m_bDormant 在 CGameSceneNode 上）
kDormantFromSceneNode=0x1

# ---- const ----
# 实体列表方案：0=CS2 块表 / 1=CS:GO 经典数组（list + 0x10*index）
kEntityScheme=0x0

# ---- bone ----
# 骨骼数组指针（旧版直接给指针；CS2 一般用 modelState+0x80）
m_pBoneArray=
# CS:GO 骨骼矩阵指针偏移（kEntityScheme=1 时用）
m_dwBoneMatrix=
# 骨骼布局：0=CS2 位置+四元数(0x20) / 1=CS:GO matrix3x4(0x30，平移在 +0x0C)
kBoneLayout=0x0
# 骨骼数组相对 modelState 的偏移（CS2 通常 0x80）
m_modelState_boneOffset=0x80
# 头骨骼索引（骨架位置不对就调这里）
kBoneIdxHead=0x6A
# 脖子骨骼索引
kBoneIdxNeck=0x6
# 胸口骨骼索引
kBoneIdxChest=0x6E
# 骨盆骨骼索引
kBoneIdxPelvis=0x0
# 左脚骨骼索引
kBoneIdxLeftFoot=0x51
# 右脚骨骼索引
kBoneIdxRightFoot=0x56

# ---- const ----
# 最大玩家数
kMaxPlayers=0x40
# 实体索引扫描上限（CS2 玩家索引常在几百，给 4096）
kEntityIndexLimit=0x1000
# 骨骼索引上限（自动标定会扫描这个范围，CS2 一般给 128）
kBoneCount=0x80
# 每根骨骼的字节数（位置 3 float + 旋转 4 float = 0x20）
kBoneStep=0x20
# 实体列表每块指针个数（CS2 常见 0x8）
kEntityListChunkSize=0x8
# 实体列表内条目步长（版本相关，用来暴力遍历时的兜底）
kEntityStride=0x70
# 实体列表：块指针在列表里的偏移（CS2 一般 0x10）
kEntityChunkOffset=0x10
# 块内条目存的是指针=1 / 实体本体=0
kEntityEntryPointer=0x1
# 视矩阵 float 数量
kViewMatrixFloats=0x10
